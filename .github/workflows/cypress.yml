name: Cypress Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    
    # Use official Cypress image matching installed Cypress version
    container:
      image: cypress/included:13.17.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install project dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npx cypress run
        env:
          CYPRESS_baseUrl: ${{ secrets.CYPRESS_BASEURL || 'https://compassion-care.ai.studio/' }}
          CYPRESS_adminEmail: ${{ secrets.CYPRESS_ADMINEMAIL || 'dizonrl20@gmail.com' }}
          CYPRESS_adminPassword: ${{ secrets.CYPRESS_ADMINPASSWORD || 'admin' }}
          CYPRESS_employeeEmail: ${{ secrets.CYPRESS_EMPLOYEEEMAIL || 'wena@wen.ca' }}
          CYPRESS_employeePassword: ${{ secrets.CYPRESS_EMPLOYEEPASSWORD || 'admin' }}
          CYPRESS_MOCK_API: 'true'
