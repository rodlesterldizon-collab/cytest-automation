name: CompassionCare E2E & REST API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cypress-run:
    name: Execute Cypress Test Suite & Upload Artifacts
    runs-on: ubuntu-latest

    # Use official Cypress image matching installed Cypress version
    container:
      image: cypress/included:13.17.0

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install Project Dependencies
        run: npm ci

      - name: Run CompassionCare E2E & API Specs
        run: npx cypress run
        env:
          CYPRESS_baseUrl: ${{ secrets.CYPRESS_BASEURL || 'https://compassion-care.ai.studio/' }}
          CYPRESS_adminEmail: ${{ secrets.CYPRESS_ADMINEMAIL }}
          CYPRESS_adminPassword: ${{ secrets.CYPRESS_ADMINPASSWORD }}
          CYPRESS_employeeEmail: ${{ secrets.CYPRESS_EMPLOYEEEMAIL || 'wena@wen.ca' }}
          CYPRESS_employeePassword: ${{ secrets.CYPRESS_EMPLOYEEPASSWORD }}
          CYPRESS_space_id: ${{ secrets.CYPRESS_SPACE_ID }}
          CYPRESS_content_api_base_url: ${{ secrets.CYPRESS_CONTENT_API_BASE_URL || 'https://compassion-care.ai.studio/api/content' }}
          CYPRESS_access_token: ${{ secrets.CYPRESS_ACCESS_TOKEN }}
          CYPRESS_MOCK_API: 'true'

      - name: Upload Mochawesome HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-html-report
          path: cypress/reports/index.html
          if-no-files-found: ignore

      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Upload Test Video Recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
